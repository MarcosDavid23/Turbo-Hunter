name: Archive original Turbo Hunter releases

on:
  push:
    branches: [main]
    paths:
      - '.github/archive-releases.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbo-hunter-release
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'MarcosDavid23/Turbo-Hunter'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out original release archives
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify and archive historical releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/archive-releases.py
